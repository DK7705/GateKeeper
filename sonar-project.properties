# =============================================================================
# SonarQube Project Configuration
# Quality Gate: Zero new Critical/Blocker, Max 5 Major, 70% coverage, 15% duplication
# =============================================================================

# Project identification
sonar.projectKey=secure-devops-platform
sonar.projectName=Secure DevOps Platform
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=app
sonar.java.binaries=app/*/target/classes
sonar.java.libraries=app/*/target/dependency/*.jar
sonar.java.test.binaries=app/*/target/test-classes
sonar.tests=app/*/src/test

# Encoding
sonar.sourceEncoding=UTF-8

# Language settings
sonar.language=java
sonar.java.source=17

# Coverage — JaCoCo
sonar.coverage.jacoco.xmlReportPaths=app/*/target/site/jacoco/jacoco.xml
sonar.junit.reportsPath=app/*/target/surefire-reports

# SonarQube server
sonar.host.url=http://sonarqube:9000

# Authentication (injected via Jenkins credentials)
# sonar.token is passed via -Dsonar.token in the pipeline

# Exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/vendor/**,**/*.test.js,**/*Test.java,**/test/**

# Quality Gate thresholds (these are configured server-side, documented here for reference)
# - Zero new Critical or Blocker severity security vulnerabilities
# - Maximum 5 new Major severity issues per build
# - Minimum 70% code coverage on new code (JaCoCo for Java)
# - Maximum 15% duplicated code density on new code

# Issue severity
sonar.issue.severity.critical=BLOCKER
sonar.issue.severity.blocker=BLOCKER

# Custom rules
sonar.java.checkstyle.reportPaths=app/*/target/checkstyle-result.xml

# Module-specific overrides
sonar.modules=api-gateway,user-service,order-service

api-gateway.sonar.projectName=API Gateway
api-gateway.sonar.sources=app/api-gateway/src/main/java
api-gateway.sonar.tests=app/api-gateway/src/test/java
api-gateway.sonar.java.binaries=app/api-gateway/target/classes

user-service.sonar.projectName=User Service
user-service.sonar.sources=app/user-service/src/main/java
user-service.sonar.tests=app/user-service/src/test/java
user-service.sonar.java.binaries=app/user-service/target/classes

order-service.sonar.projectName=Order Service
order-service.sonar.sources=app/order-service/src/main/java
order-service.sonar.tests=app/order-service/src/test/java
order-service.sonar.java.binaries=app/order-service/target/classes
