# =============================================================================
# Alertmanager Rules — Critical application and infrastructure alerts
# =============================================================================

groups:
  - name: application_alerts
    rules:
      # Error rate > 5%
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (service)
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
          team: devsecops
        annotations:
          summary: "High error rate detected on {{ $labels.service }}"
          description: "Error rate is {{ printf \"%.2f\" $value }}% on {{ $labels.service }} (threshold: 5%)"
          runbook_url: "https://wiki.internal/runbooks/high-error-rate"

      # p99 latency > 500ms
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High p99 latency on {{ $labels.service }}"
          description: "p99 latency is {{ printf \"%.3f\" $value }}s on {{ $labels.service }} (threshold: 500ms)"
          runbook_url: "https://wiki.internal/runbooks/high-latency"

      # Pod crash-looping
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 3
        for: 5m
        labels:
          severity: critical
          team: devsecops
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ printf \"%.0f\" $value }} times in the last hour"
          runbook_url: "https://wiki.internal/runbooks/pod-crashloop"

  - name: infrastructure_alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          (
            sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, namespace)
            /
            sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod, namespace)
          ) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on pod {{ $labels.pod }}"
          description: "CPU usage is {{ printf \"%.1f\" $value }}% on {{ $labels.pod }}"

      # High Memory usage
      - alert: HighMemoryUsage
        expr: |
          (
            sum(container_memory_working_set_bytes{container!=""}) by (pod, namespace)
            /
            sum(kube_pod_container_resource_limits{resource="memory"}) by (pod, namespace)
          ) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on pod {{ $labels.pod }}"
          description: "Memory usage is {{ printf \"%.1f\" $value }}% on {{ $labels.pod }}"

      # Pod not ready
      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 5 minutes"

      # Deployment replicas mismatch
      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_ready_replicas
        for: 10m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "Deployment {{ $labels.deployment }} has replica mismatch"
          description: "Deployment {{ $labels.deployment }} has {{ $value }} replicas desired but not all are ready"

  - name: pipeline_alerts
    rules:
      # Jenkins build failure rate
      - alert: JenkinsBuildFailures
        expr: |
          increase(jenkins_builds_failed_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High Jenkins build failure rate"
          description: "{{ printf \"%.0f\" $value }} builds have failed in the last hour"

      # Disk space on nodes
      - alert: NodeDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ printf \"%.1f\" $value }}% disk space remaining on {{ $labels.instance }}"
