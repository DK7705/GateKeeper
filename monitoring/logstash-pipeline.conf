# =============================================================================
# Logstash Pipeline Configuration
# Collects structured JSON app logs and pipeline execution logs
# =============================================================================

input {
  # Application logs via Filebeat/TCP
  tcp {
    port => 5044
    codec => json_lines {
      charset => "UTF-8"
    }
    type => "application"
    tags => ["app-logs"]
  }

  # Pipeline execution logs via HTTP
  http {
    port => 8080
    codec => json
    type => "pipeline"
    tags => ["pipeline-logs"]
  }

  # Beats input for Filebeat agents
  beats {
    port => 5045
    type => "filebeat"
    tags => ["filebeat"]
  }
}

filter {
  # Parse application logs
  if [type] == "application" or "app-logs" in [tags] {
    # Parse JSON structured logs
    if [message] =~ /^\{/ {
      json {
        source => "message"
        target => "app"
        skip_on_invalid_json => true
      }
    }

    # Extract service name
    if [app][service] {
      mutate {
        add_field => { "service_name" => "%{[app][service]}" }
      }
    }

    # Parse timestamp
    date {
      match => ["[app][timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
    }

    # Add correlation fields
    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:production}"
        "cluster" => "${CLUSTER_NAME:secure-devops-cluster}"
      }
    }

    # Categorize log levels
    if [app][level] == "ERROR" or [app][level] == "FATAL" {
      mutate {
        add_tag => ["error"]
      }
    }

    if [app][level] == "WARN" {
      mutate {
        add_tag => ["warning"]
      }
    }
  }

  # Parse pipeline logs
  if [type] == "pipeline" or "pipeline-logs" in [tags] {
    # Extract build information
    if [build_number] {
      mutate {
        add_field => {
          "pipeline_build" => "%{[build_number]}"
        }
      }
    }

    # Parse git commit info for correlation
    if [git_commit] {
      mutate {
        add_field => {
          "code_change_id" => "%{[git_commit]}"
        }
      }
    }
  }

  # Common enrichment for all log types
  mutate {
    remove_field => ["host", "agent"]
  }

  # Fingerprint for deduplication
  fingerprint {
    source => ["message", "@timestamp"]
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }

  # GeoIP for external IPs (if applicable)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
}

output {
  # Application logs → app-logs index
  if [type] == "application" or "app-logs" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "app-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][fingerprint]}"
      template_name => "app-logs"
      template => "/usr/share/logstash/templates/app-logs-template.json"
      template_overwrite => true
    }
  }

  # Pipeline logs → pipeline-logs index
  if [type] == "pipeline" or "pipeline-logs" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "pipeline-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }

  # Debug output (disabled in production)
  # stdout { codec => rubydebug }
}
