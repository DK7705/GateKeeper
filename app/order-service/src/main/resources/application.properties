# =============================================================================
# Order Service Application Properties
# =============================================================================

server.port=8082
spring.application.name=order-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/orderdb
spring.datasource.username=appuser
spring.datasource.password=appuser_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=order-service

# Logging (JSON structured)
logging.level.root=INFO
logging.level.com.example.orderservice=DEBUG
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%level","service":"order-service","logger":"%logger","message":"%msg","thread":"%thread"}%n
