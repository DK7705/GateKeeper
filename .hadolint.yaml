# =============================================================================
# Hadolint Configuration — Dockerfile Linting Rules
# Enforces hardened container image standards
# =============================================================================

# Treat these rules as FATAL errors (pipeline blockers)
failure-threshold: error

# Override specific rules to error level
override:
  error:
    # DL3006: Always tag the version of an image explicitly (we require digest pinning)
    - DL3006
    # DL3007: Using latest is always a risk
    - DL3007
    # DL3002: Last USER should not be root
    - DL3002
    # DL3003: Use WORKDIR to switch to a directory
    - DL3003
    # DL3008: Pin versions in apt-get install
    - DL3008
    # DL3009: Delete the apt-get lists after installing something
    - DL3009
    # DL3010: Use ADD for extracting archives into an image (we enforce COPY instead)
    - DL3010
    # DL3015: Avoid additional packages by specifying --no-install-recommends
    - DL3015
    # DL3018: Pin versions in apk add
    - DL3018
    # DL3020: Use COPY instead of ADD for files and folders
    - DL3020
    # DL3025: Use arguments JSON notation for CMD and ENTRYPOINT arguments
    - DL3025
    # DL4006: Set the SHELL option -o pipefail before a pipe
    - DL4006
    # SC2086: Double quote to prevent globbing and word splitting
    - SC2086

  warning:
    # DL3011: Valid UNIX ports range from 0 to 65535
    - DL3011
    # DL3013: Pin versions in pip
    - DL3013

  info:
    # DL3004: Do not use sudo as it leads to unpredictable behavior
    - DL3004

# Ignore these rules globally (with documented justification)
ignored:
  # DL3059: Multiple consecutive RUN instructions — sometimes needed for layer caching
  - DL3059

# Trusted registries — only allow images from these registries
trustedRegistries:
  - docker.io
  - gcr.io
  - ghcr.io
  - registry.access.redhat.com
  - public.ecr.aws

# Strict mode: fail on any warning
strict-labels: true
